name: Build Mahmoud Assistant APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Extract Project ZIP
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            for z in *.zip; do
              if [ -f "$z" ]; then
                echo "Found $z - extracting project files..."
                unzip -o "$z"
              fi
            done
          fi
          if [ -d "mahmoud_assistant_project" ] && [ ! -f "settings.gradle.kts" ]; then
            cp -r egypt-wallets-appa/* .
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mahmoud-assistant-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./-assistant-v1.0.apk
          gh release delete v1.0-latest --yes || true
          git tag -d v1.0-latest || true
          git push origin :refs/tags/v1.0-latest || true
          gh release create v1.0-latest ./mahmoud-assistant-v1.0.apk --title "مساعد المهندس للألوميتال وPVC - APK مباشر" --notes "اضغط على ملف mahmoud-assistant-v1.0.apk بالأسفل لتحميل وتثبيت التطبيق مباشرة على هاتف الأندرويد."
          
